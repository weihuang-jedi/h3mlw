paths:
  data_pattern: "../data/global_h3_20years.zarr"
  edge_index_pt: "h3_edge_index.pt"
  checkpoint_dir: "checkpoints/"

model_params:
  history_steps: 2
  static_features: 2       
  solar_features: 4        
  forecast_offset: 1
  learning_rate: 0.0001    # Base minimal boundary LR
  max_lr: 0.0006           # Peak boundary learning rate for your cyclic scheduler
  hidden_channels: 32
  attention_heads: 4

training_params:
  batch_size: 16           
  num_workers: 4           # Sized down worker threads to prevent storage overloading
  max_epochs: 5            # Sized down epochs; 20 years of data provides ample optimization batches
  num_nodes: 1

