paths:
  # Path to your master 3D time-series NetCDF file
  data_nc: "/scratch4/NAGAPE/epic/Wei.Huang/src/h3/data/global_h3_res2_air_all_times.nc"
  # Destination where the generated graph topology matrix is saved/read
  edge_index_pt: "/scratch4/NAGAPE/epic/Wei.Huang/src/h3/data/h3_edge_index.pt"
  # Directory where model weights and checkpoints will be saved
  checkpoint_dir: "/scratch4/NAGAPE/epic/Wei.Huang/src/h3/data/checkpoints/"

model_params:
  history_steps: 2
  weather_features: 4      # air, uwnd, vwnd, rhum
  static_features: 2       # land_sea_mask, elevation
  solar_features: 4        # diurnal_sin, diurnal_cos, annual_sin, annual_cos
  forecast_offset: 1
  learning_rate: 0.0002
  hidden_channels: 64      # Sized up to capture cross-variable features
  attention_heads: 4

training_params:
  batch_size: 4
  num_workers: 8
  max_epochs: 20
  num_nodes: 1

